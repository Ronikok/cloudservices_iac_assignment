#cloud-config
package_update: true
package_upgrade: true

packages:
  - apache2

runcmd:
  - echo "editing index.html..."
  - echo "${page_message} ${student_name}" > /var/www/html/index.html
  - echo "enabling apache2..."
  - systemctl enable apache2
  - echo "starting apache2..."
  - systemctl start apache2
